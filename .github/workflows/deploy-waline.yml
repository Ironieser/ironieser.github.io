name: Deploy Waline Server

# Deploys Waline comment server to Vercel. Runs only when waline-config/ exists (template has none; add folder + Vercel secrets to use).
on:
  push:
    paths:
      - 'waline-config/**'
      - '.github/workflows/deploy-waline.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: hashFiles('waline-config/**') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./waline-config
          
      - name: Update Comment System Status
        run: |
          echo "✅ Waline server deployed successfully"
          echo "🌐 Server URL: ${{ steps.deploy.outputs.preview-url }}" 