name: Sync Google Scholar Publications

on:
  schedule:
    # Every Monday at 08:00 UTC. Scheduled workflows run from the
    # repository's default branch, so that copy must keep this job in sync.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-sync-ironieser
  cancel-in-progress: false

jobs:
  sync-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ironieser
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        
    - name: Install dependencies
      run: |
        npm ci
        npm install --no-save --package-lock=false puppeteer cheerio axios
        
    - name: Sync Google Scholar publications
      run: node .github/scripts/sync-scholar.js
      env:
        SCHOLAR_USER_ID: ${{ secrets.SCHOLAR_USER_ID }}
        
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet config/content.json config/meta.json; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add config/content.json config/meta.json
        git commit -m "🔄 Auto-sync publications from Google Scholar"
        git push origin HEAD:ironieser
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
