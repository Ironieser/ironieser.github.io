name: Link Checker

on:
  schedule:
    # Monthly (1st day of month, UTC)
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p lychee

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          format: markdown
          output: lychee/out.md
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 2
            --accept 200,206,429
            --exclude-mail
            --exclude-loopback
            ./index.html
            ./publications.html
            ./blog.html
            ./projects/*.html
            https://sixundong.com

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee/out.md

      - name: Create issue if broken links found
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link Checker: broken links detected"
          content-filepath: lychee/out.md
          labels: |
            automated
            broken-link
