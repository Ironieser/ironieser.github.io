name: Link Checker

on:
  schedule:
    # Monthly (1st day of month, UTC)
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Prepare report directory
        run: mkdir -p lychee

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          format: markdown
          output: lychee/out.md
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 2
            --accept 200,206,429
            --exclude-loopback
            ./index.html
            ./publications.html
            ./blog.html

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee/out.md
