# ============================================================
# One-time site setup (do not change often)
# - SEO / meta / JSON-LD
# - Optional visitor analytics
# - Short URL redirects for project pages
# - Copyright (footer line: "© {start_year} - {current_year} {name}. All rights reserved.")
# ============================================================

# Copyright: start year for footer (current year is added automatically, e.g. 2025 - 2026)
copyright_start_year: 2025

# Optional self-hosted visitor analytics requires Cloudflare Pages Functions + D1.
# Keep disabled for the GitHub Pages demo; see docs/VISITOR_ANALYTICS.md.
visitor_map:
  enabled: false

# SEO & site identity (meta tags, Open Graph, JSON-LD)
seo:
  enable_json_ld: true
  website_url: "https://yourusername.github.io"
  github_pages_url: "https://yourusername.github.io"
  legacy_urls: []
  website_name: "Academic Website Template - Demo Profile"
  website_description: "Template demo site for academic homepage setup and customization."
  keywords:
    - computer vision
    - multimodal AI
    - machine learning
    - deep learning
    - artificial intelligence
    - academic research
  author:
    name: "Template Demo User"
    alternate_name: "Template Profile"
    email: "meow@example.edu"
    academic_email: "meow@example.edu"
    affiliation: "PhD Candidate (Allegedly), Meowstar University, Planet Meow"
    job_title: "PhD Student"
    research_areas:
      - multimodal AI systems
      - computer vision
      - natural language processing
      - procrastination
    google_scholar_id: "YOUR_SCHOLAR_ID"
    orcid: null
    github: "yourusername"
    twitter: "yourusername"
  organization:
    name: "Meowstar University"
    type: "CollegeOrUniversity"
    url: "https://yourusername.github.io"
    address:
      addressCountry: "Planet Meow"
      addressLocality: "Cat City"
      addressRegion: "Cat Province"

# Short URL redirects (e.g. /mypaper -> /projects/mypaper.html)
redirects:
  - alias: mypaper
    target: /projects/mypaper.html
