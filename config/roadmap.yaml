    card_kind: context
    year: 2023
    short_label: Digital Human Gen. & Anim.
    tags: [generative_modeling, video_multimodal]
    stages: [world_modeling]
    context:
      kicker: Multimodal Generative Modeling
      tooltip_role: Research Intern
      meta: DGene, Digital Human Algorithm Dept. · May 2023 – Jan 2024
      detail: (1) Talking-head video (SoTA on commercial & academic benchmarks); (2) 3D body reconstruction (<7% error); (3) co-speech gesture generation.
