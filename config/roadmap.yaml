enabled: true
title: Research Roadmap
subtitle: From Perception to Agentic Intelligence
description: Building next-generation multimodal systems.

ongoing:
  - phase: world_modeling
    label: Generative World Models
    status: Ongoing
    note: Continuing work on controllable video & 3D generative modeling.
  - phase: agentic_systems
    label: Long-term Memory
    status: Ongoing
    note: Memory-augmented agent cognition and retrieval.
  - phase: agentic_systems
    label: Recursive Self-Improvement
    status: Next
    note: Agents that improve the models and harnesses they run on through their own traces and synthetic data.

vision_loop:
  label: Self-Improvement Loop
  text: Agents generate traces and synthetic data that retrain the models they run on, closing the loop toward recursive self-improvement.

phases:
  - id: perception
    title: Perception
    icon: 🎬
    summary: Video understanding, representation learning, and alignment.
    stageIds: [perception, alignment]
    maxItems: 2
  - id: world_modeling
    title: World Modeling
    icon: 🪄
    summary: 3D, diffusion, and generative modeling across modalities.
    stageIds: [world_modeling]
    maxItems: 3
    columns: 2
  - id: agentic_systems
    title: Agentic Systems
    icon: 🧠
    summary: Building and evaluating model capabilities, running them efficiently, and composing them into agents that plan and act over long horizons.
    stageIds: [efficient_systems, agentic_reasoning]
    maxItems: 8
    columns: 2
    groups:
      - id: capabilities
        label: Model Capabilities
        icon: 🧪
        row: top
      - id: inference
        label: Efficient Inference
        icon: ⚡
        row: top
      - id: agents
        label: "Long-Horizon Agents: Orchestration · Memory · Execution"
        icon: 🤖
        row: bottom
        ongoing: true

