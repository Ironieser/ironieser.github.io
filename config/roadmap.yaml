  - id: cinecrew
    paper_url: https://arxiv.org/abs/2609.07720
    short_label: CineCrew
    title: "Better Call CineCrew: Consistent Ultra-Long Narrative-to-Film Generation"
    authors: [Jiaben Chen*, Sixun Dong*, Qinhong Zhou, Raine Ma, Zhiyang Dou, Wojciech Matusik, Chuang Gan]
    venue: ECCV'26
    venue_type: conference
    group: agents
    tags: [reasoning_agents, generative_modeling, video_multimodal]
    stages: [agentic_reasoning]
    importance: 2
    tldr: "A multi-agent 'film crew' for ultra-long narrative-to-film generation: agents plan shots and camera in FilmDSL (reasoning), drive off-the-shelf video generators and repair failed clips (execution), and carry persistent character, asset, and persona state across the whole film (memory) to keep it consistent. Joint work with UMass & MIT."
