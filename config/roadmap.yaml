enabled: true
title: Research Roadmap
subtitle: From Perception to Agentic Intelligence
description: Building next-generation multimodal systems.

ongoing:
  - phase: world_modeling
    label: Generative World Models
    status: Ongoing
    note: Continuing work on controllable video & 3D generative modeling.
  - phase: agentic_systems
    label: Long-term Memory
    status: Ongoing
    note: Memory-augmented agent cognition and retrieval.

vision_loop:
  label: Future Loop
  text: Agent traces and synthetic data feed back into multimodal understanding and generative modeling.

phases:
  - id: perception
    title: Perception
    icon: 🎬
    summary: Video understanding, representation learning, and alignment.
    stageIds: [perception, alignment]
    maxItems: 2
  - id: world_modeling
    title: World Modeling
    icon: 🪄
    summary: 3D, diffusion, and generative modeling across modalities.
    stageIds: [world_modeling]
    maxItems: 3
    columns: 2
  - id: agentic_systems
    title: Agentic Systems
    icon: 🧠
    summary: Efficient inference, tool use, and agentic reasoning.
    stageIds: [efficient_systems, agentic_reasoning]
    maxItems: 8
    columns: 2
    groups:
      - id: inference
        label: Inference Acceleration
        icon: ⚡
        row: top
        gridColumns: 3
      - id: reasoning
        label: Reasoning & Execution
        icon: 🛠️
        row: bottom
        gridColumns: 3
    ongoingGroup:
      label: Memory
      icon: 💾
      row: top

filters:
  - id: video_multimodal
    name: Multimodal
  - id: generative_modeling
    name: Generative Modeling
  - id: efficient_ai
    name: Efficient AI
  - id: reasoning_agents
    name: Reasoning & Agents

